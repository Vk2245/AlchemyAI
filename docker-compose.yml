version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: DEV/backend/Dockerfile
    container_name: catalogx-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/catalogx.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      # Note: For production, provide a real SECRET_KEY and HMAC_KEY here or in a .env file
    volumes:
      # Mount the local uploads and reports directories so they persist across restarts
      - ./DEV/backend/uploads:/app/DEV/backend/uploads
      - ./DEV/backend/reports:/app/DEV/backend/reports
      - catalogx_db:/app
    networks:
      - catalogx-net
    restart: unless-stopped

  frontend:
    build:
      context: ./DEV/frontend
      dockerfile: Dockerfile
    container_name: catalogx-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - catalogx-net
    restart: unless-stopped

networks:
  catalogx-net:
    driver: bridge

volumes:
  catalogx_db:
